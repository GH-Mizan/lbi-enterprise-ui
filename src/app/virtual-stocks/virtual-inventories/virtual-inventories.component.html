<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <h1> TOTAL STOCKS </h1>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-header">
                    <form class="form" autocomplete="off">
                        <div class="row">
                            <div class="col-sm-12 col-md-4 col-lg-4">
                                <div class="form-group row">
                                    <label class="col-4 col-form-label" for="type">Type</label>
                                    <div class="col-8">
                                        <select class="form-select form-control" name="type" id="type"
                                            [(ngModel)]="typeId" (ngModelChange)="onTypeChanged()"
                                            style="height: calc(2.25rem + 6px)">
                                            <option *ngFor="let t of warehouseTypes" [value]="t.value">
                                                {{t.displayText}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-sm-12 col-md-4 col-lg-4">
                                <div class="form-group row">
                                    <label class="col-4 col-form-label" for="warehouse">Warehouse</label>
                                    <div class="col-8">
                                        <select class="form-select form-control" name="warehouse" id="warehouse"
                                            [(ngModel)]="warehouseId" (ngModelChange)="list()"
                                            style="height: calc(2.25rem + 6px)">
                                            <option *ngFor="let w of warehouses" [value]="w.value">
                                                {{w.displayText}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-sm-12 col-md-4 col-lg-4">
                                <div class="form-group row">
                                    <label class="col-4 col-form-label" for="item">Item</label>
                                    <div class="col-8">
                                        <select class="form-select form-control" name="item" id="item"
                                            [(ngModel)]="itemId" (ngModelChange)="list()"
                                            style="height: calc(2.25rem + 6px)">
                                            <option *ngFor="let i of items" [value]="i.value">
                                                {{i.displayText}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </form>
                  
                </div>
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable (onLazyLoad)="list($event)" [value]="primengTableHelper.records"
                            [scrollable]="true" scrollHeight="700px"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [loading]="primengTableHelper.isLoading" [showGridlines]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Item</th>
                                    <th>Warehouse</th>
                                    <th class="text-center">Quantity</th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.productName }}</span>
                                    </td>

                                    <td>
                                        <span>{{ record.warehouseName }}</span>
                                    </td>
                                    <td class="text-center">
                                        <span>{{ record.stockQty }}</span>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                        <div class="ui-table-footer"></div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </section>
</div>
