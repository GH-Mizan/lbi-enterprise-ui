<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <h1>Account Heads</h1>
                </div>
                <div class="col-6 text-right">
                    <a href="javascript:;" class="btn bg-blue" (click)="create()">
                        <i class="fa fa-plus-square"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-header">
                    <div class="row">
                        <label class="col-md-1 col-form-label"> Type </label>
                        <div class="col-md-2">
                            <select class="form-select form-control" name="type" id="type" #typeModel="ngModel" #typeEl
                                [(ngModel)]="type" (ngModelChange)="list()">
                                <option *ngFor="let t of types" [value]="t.value">{{t.displayText}}
                                </option>
                            </select>
                            <abp-validation-summary [control]="typeModel" [controlEl]="typeEl"></abp-validation-summary>
                        </div>
                    </div>

                </div>
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)"
                            [value]="primengTableHelper.records"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th style="min-width: 150px"> Parent Name </th>
                                    <th style="min-width: 150px"> Name </th>
                                    <th style="width: 68px"> Type </th>
                                    <th class="text-center">
                                        {{ "Actions" }}
                                    </th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.parentName }}</span>
                                    </td>
                                    <td>
                                        <span>{{ record.name }}</span>
                                    </td>
                                    <td>
                                        <span>{{ record.typeText }}</span>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-sm bg-secondary" (click)="edit(record.id)">
                                            <i class="fas fa-pencil-alt"></i>
                                        </button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>
            </div>
        </div>
    </section>
</div>
