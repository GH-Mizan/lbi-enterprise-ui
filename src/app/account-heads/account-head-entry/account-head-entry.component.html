<form class="form-horizontal" autocomplete="off" #etryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header title="Create Account Head" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row">
            <label class="col-md-3 col-form-label"> Type </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="type" id="type" #typeModel="ngModel" #typeEl
                    [(ngModel)]="model.type">
                    <option *ngFor="let t of types" [value]="t.value">{{t.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="typeModel" [controlEl]="typeEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label"> Parent Head </label>
            <div class="col-md-9">
                <select class="form-select form-control" name="pHead" id="pHead" #pHeadModel="ngModel" #pHeadEl
                    [(ngModel)]="model.parentHead">
                    <option *ngFor="let ph of parentHeads" [value]="ph.value">{{ph.displayText}}
                    </option>
                </select>
                <abp-validation-summary [control]="pHeadModel" [controlEl]="pHeadEl"></abp-validation-summary>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">Head</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="name" id="name" required [(ngModel)]="model.name"
                    #nameModel="ngModel" #nameEl />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>
    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!etryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
