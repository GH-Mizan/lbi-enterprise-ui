<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <h1>Inventories</h1>
                </div>
                <div class="col-6 text-right">
                    <a href="javascript:;" class="btn bg-blue" (click)="openTransferModal()">
                        <i class="fas fa-arrow-alt-circle-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)"
                            [value]="primengTableHelper.records"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th> StockPoint </th>
                                    <th>
                                        Stock
                                    </th>
                                    <th style="width: 60px; min-width: 60px" class="text-center">
                                        {{ "Actions" }}
                                    </th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.stockPointName }}</span>
                                    </td>
                                    <td>
                                        <span>{{record.stock}}</span>
                                    </td>
                                    <td class="text-center" style="width: 110px">
                                        <button type="button" class="btn btn-sm bg-blue mx-1"
                                            (click)="showBreakpoints(record)">
                                            <i class="fas fa-external-link-square-alt"></i>
                                        </button>
                                        <button type="button" class="btn btn-sm bg-green"
                                            (click)="showHistories(record.productId)">
                                            <i class="fa fa-history"></i>
                                        </button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                        <div class="ui-table-footer"></div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>

            </div>
        </div>
    </section>
</div>
