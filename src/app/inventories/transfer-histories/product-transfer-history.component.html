<div class="modal-body">
    <abp-modal-header title="Product Transfer History" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>

    <div class="card table-wrapper">
        <div class="card-header">
            <form class="form" autocomplete="off">
                <div class="row">
                    <div class="col-sm-12 col-md-5 col-lg-5">
                        <div class="form-group row">
                            <label class="col-3 col-form-label" for="product">Product</label>
                            <div class="col-9">
                                <select class="form-select form-control" name="product" id="product"
                                    [(ngModel)]="productId" style="height: calc(2.25rem + 6px)">
                                    <option *ngFor="let p of products" [value]="p.value">
                                        {{p.displayText}}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="col-12" *ngIf="mobileView">
                        <div class="form-group row">
                            <label class="col-3 col-form-label" for="date">Date</label>
                            <div class="col-6">
                                <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy"
                                    name="date" />
                            </div>
                            <div class="col-3 float-right">
                                <button type="button" class="btn bg-blue mx-1" (click)="list()"
                                    style="margin-top: 4px;">
                                    Search
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-sm-12 col-md-5 col-lg-5" *ngIf="!mobileView">
                        <div class="form-group row">
                            <label class="col-3 col-form-label" for="date">Date</label>
                            <div class="col-9">
                                <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy"
                                    name="date" />
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-sm-12 col-md-2 col-lg-2" *ngIf="!mobileView">
                        <div class="float-right">
                            <button type="button" class="btn bg-blue mx-1" (click)="list()">
                                Search
                            </button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
        <div class="card-body table-responsive table-striped table-bordered">
            <!--<Primeng-TurboTable-Start>-->
            <div class="primeng-datatable-container">
                <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)" [value]="primengTableHelper.records"
                    rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true">
                    <ng-template pTemplate="header">
                        <tr>
                            <th style="min-width: 180px;"> Transfer Date </th>
                            <th> From Stock </th>
                            <th> To Stock </th>
                            <th> Qty </th>
                            <th class="text-center"> Actions </th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body" let-record="$implicit">
                        <tr>
                            <td>
                                <span>{{ record.transferDate | date: 'dd-MMM-yy hh:mm:ss a' }}</span>
                            </td>
                            <td>
                                <span>{{ record.fromStockPointName }}</span>
                            </td>
                            <td>
                                <span>{{record.toStockPointName}}</span>
                            </td>
                            <td>
                                <span>{{record.transferQuantity}}</span>
                            </td>

                            <td class="text-center">
                                <button type="button" class="btn btn-sm bg-danger" (click)="delete(record)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
                <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                    <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                </div>
                <div class="ui-table-footer"></div>
            </div>
            <!--<Primeng-TurboTable-End>-->
        </div>
    </div>
</div>
