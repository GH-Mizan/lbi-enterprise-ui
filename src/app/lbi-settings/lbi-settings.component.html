<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6">
                    <h1>Settings</h1>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-body">
                    <table class="table table-responsive table-striped table-bordered w-100">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th>Value</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody *ngIf="!loading">
                            <tr *ngFor="let record of data">
                                <td>
                                    <span>{{ record.keyText }}</span>
                                </td>
                                <td>
                                    <input type="text" [(ngModel)]="record.value" class="form-control" />
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm bg-secondary" (click)="update(record)">
                                        <i class="fas fa-save"></i>
                                    </button>
                                </td>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>
