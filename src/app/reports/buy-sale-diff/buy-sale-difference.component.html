<div [@routerTransition]>
    <section class="content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <h1>Purchase and Sale Difference</h1>
                </div>
            </div>
        </div>
    </section>
    <section class="content px-2 pb-3">
        <div class="container-fluid">
            <div class="card table-wrapper">
                <div class="card-header">
                    <form class="form" autocomplete="off">
                        <div class="row">
                            <div class="col-sm-12 col-md-3 col-lg-3">
                                <div class="form-group row">
                                    <div class="col-12">
                                        <select class="form-select form-control" name="monthId" id="monthId"
                                            [(ngModel)]="monthId" style="height: calc(2.25rem + 6px)"
                                            (ngModelChange)="list()">
                                            <option *ngFor="let m of months" [value]="m.value">{{m.displayText}}
                                            </option>
                                        </select>
                                    </div>

                                </div>
                            </div>
                            <div class="col-sm-12 col-md-3 col-lg-3">
                                <div class="form-group row">
                                    <div class="col-12">
                                        <select class="form-select form-control" name="yearId" id="yearId"
                                            [(ngModel)]="yearId" style="height: calc(2.25rem + 6px)"
                                            (ngModelChange)="list()">
                                            <option *ngFor="let y of years" [value]="y.value">{{y.displayText}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-12 col-md-3 col-lg-3">
                                <div class="form-group row">
                                    <div class="col-12">
                                        <p-datepicker [(ngModel)]="date" [readonlyInput]="true" dateFormat="dd/M/yy"
                                            [showIcon]="true" (ngModelChange)="list()" [showButtonBar]="true" name="date" id="date"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-body table-responsive table-striped table-bordered">
                    <!--<Primeng-TurboTable-Start>-->
                    <div class="primeng-datatable-container">
                        <p-table #dataTable (onLazyLoad)="list($event)" [value]="primengTableHelper.records"
                            [scrollable]="true" scrollHeight="700px"
                            rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                            [loading]="primengTableHelper.isLoading" [showGridlines]="true"
                            [tableStyle]="{ 'min-width': '50rem' }">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th> Product </th>
                                    <th class="text-center"> Purchase </th>
                                    <th class="text-center"> Sale </th>
                                    <th class="text-center"> Difference </th>
                                </tr>
                            </ng-template>

                            <ng-template pTemplate="body" let-record="$implicit">
                                <tr>
                                    <td>
                                        <span>{{ record.productName }}</span>
                                    </td>
                                    <td class="text-center">
                                        <span>{{ record.purchase }}</span>
                                    </td>
                                    <td class="text-center">
                                        <span>{{ record.sales }}</span>
                                    </td>
                                    <td class="text-center">
                                        <span>{{record.difference }}</span>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                        <div class="primeng-no-data text-center" *ngIf="primengTableHelper.totalRecordsCount == 0">
                            <img src="assets/img/no-data.png" alt="Logo" style="margin-top:20px" />
                        </div>
                        <div class="ui-table-footer"></div>
                    </div>
                    <!--<Primeng-TurboTable-End>-->
                </div>

            </div>
        </div>
    </section>
</div>
