<form class="form-horizontal" autocomplete="off" #orderEntryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header [title]="model.id ? 'Edit Order' : 'Add Order'"
        (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="date">Date</label>
            <div class="col-md-9">
                <p-datepicker [(ngModel)]="date" [showIcon]="true" inputId="buttondisplay" [showOnFocus]="false"
                    dateFormat="dd-M-yy" name="date" id="date" />
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="client"> Client </label>
            <div class="col-md-9">
                <p-select [options]="customers" [(ngModel)]="clientObj" (ngModelChange)="onClientChanged()"
                    optionLabel="displayText" name="customer" id="customer" [filter]="true" filterBy="displayText"
                    class="w-full w-100">
                    <ng-template #selectedItem let-selectedOption>
                        <div class="flex items-center gap-2">
                            <div>{{ selectedOption.displayText }}</div>
                        </div>
                    </ng-template>
                    <ng-template let-client #item>
                        <div class="flex items-center gap-2">
                            <div>{{ client.displayText }}</div>
                        </div>
                    </ng-template>
                </p-select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="nitrous"> Nitrous </label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="nitrous" id="nitrous" [(ngModel)]="model.nitrousQty" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="o136"> Oxygen 1.36 </label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="o136" id="o136" [(ngModel)]="model.oxygen136Qty" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="air"> Air </label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="air" id="air" [(ngModel)]="model.airQty" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="department"> Oxygen 9.80 </label>
            <div class="col-md-9">
                <input type="number" selectOnFocus class="form-control" name="o980" id="o980"
                    [(ngModel)]="model.oxygen980Qty" />
            </div>
        </div>

    </div>
    <abp-modal-footer [cancelDisabled]="saving"
        [saveDisabled]="!orderEntryModal.form.valid || saving || !model.customerId"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
