<form class="form-horizontal" autocomplete="off" #entryModal="ngForm" (ngSubmit)="save()">
    <abp-modal-header title="Create/ Edit Additional Party" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
    <div class="modal-body">
        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="name">{{ "Name" | localize }}</label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="name" id="name" required [(ngModel)]="model.partyName"
                    #nameModel="ngModel" #nameEl />
                <abp-validation-summary [control]="nameModel" [controlEl]="nameEl"></abp-validation-summary>
            </div>
        </div>

         <div class="form-group row">
            <label class="col-md-3 col-form-label" for="contactNumber"> Contact Number </label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="contactNumber" id="contactNumber" [(ngModel)]="model.contactNumber"/>
                
            </div>
        </div>

          <div class="form-group row">
            <label class="col-md-3 col-form-label" for="email"> Email </label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="email" id="email" [(ngModel)]="model.email"/>
                
            </div>
        </div>

        <div class="form-group row">
            <label class="col-md-3 col-form-label" for="relation"> Relation </label>
            <div class="col-md-9">
                <input type="text" class="form-control" name="relation" id="relation" [(ngModel)]="model.relation"/>
                
            </div>
        </div>

         <div class="form-group row">
            <label class="col-md-3 col-form-label" for="address"> Address </label>
            <div class="col-md-9">
                <textarea class="form-control" name="address" id="address" [(ngModel)]="model.address"></textarea>
            </div>
        </div>

        <div class="form-group row required">
            <label class="col-md-3 col-form-label" for="advance">Advance</label>
            <div class="col-md-9">
                <input type="number" class="form-control" name="advance" id="advance" required [(ngModel)]="model.advance"
                    #advanceModel="ngModel" #advanceEl (wheel)="$event.preventDefault()"/>
                <abp-validation-summary [control]="advanceModel" [controlEl]="advanceEl"></abp-validation-summary>
            </div>
        </div>

         <div class="form-group row">
            <label class="col-md-3 col-form-label" for="notes"> Notes </label>
            <div class="col-md-9">
                <textarea class="form-control" name="notes" id="notes" [(ngModel)]="model.notes"></textarea>
            </div>
        </div>
        
    </div>
    <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!entryModal.form.valid || saving"
        (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
